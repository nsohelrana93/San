<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>হ্যালো ওয়ার্ল্ড ডকুমেন্ট</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2b2b2b;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fafafa;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #0078d4;
        }
        h1 {
            color: #0078d4;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #555555;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #888888;
            text-align: center;
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>হ্যালো ওয়ার্ল্ড! (Hello World)</h1>
        <p>এটি একটি সুন্দরভাবে ডিজাইন করা সাধারণ ওয়েব পেজ (HTML File)। আপনি এই ফাইলটি যেকোনো ব্রাউজারে (যেমন- Chrome, Edge) ডাবল ক্লিক করে দেখতে পারবেন অথবা কোড এডিটরে এডিট করতে পারবেন।</p>
        
        <div class="footer">
            তৈরি করা হয়েছে: ২০২৬ সাল
        </div>
    </div>

</body>
</html>
