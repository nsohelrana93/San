<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sohel Rana - Fixed 3D Card (Link Image Version)</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
  body {
    margin: 0;
    background: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  .layout-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .outer-heading {
    color: #00ffff;
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
    margin: 0;
    padding-bottom: 5px;
  }

  .card-container {
    perspective: 1500px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .card-wrapper {
    position: relative;
    width: 300px;
    border-radius: 20px;
    padding: 2px;
    overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .card-wrapper::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    top: -50%;
    left: -50%;
    background: conic-gradient(
      transparent,
      #00ffff,
      transparent,
      #00ffff
    );
    animation: rotateCard 4s linear infinite;
  }

  .card-wrapper::after {
    content: "";
    position: absolute;
    inset: 2px;
    background: #0b132b;
    border-radius: 18px;
    z-index: 1;
  }

  .active .card-wrapper {
    transform: rotateX(40deg);
    overflow: visible;
  }

  .active .card-wrapper::before {
    display: none;
  }

  .card {
    position: relative;
    background: #0b132b;
    border-radius: 20px;
    padding: 40px 20px;
    text-align: center;
    z-index: 2;
    transform-style: preserve-3d;
  }

  .img-box {
    position: relative;
    width: 120px;
    height: 120px;
    margin: auto;
    margin-bottom: 30px;
    transform-style: preserve-3d;
    transition: 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: visible;
  }

  .active .img-box {
    transform: translateZ(100px) translateY(-10px) scale(1.8);
  }

  .img-box img {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  .img-box .profile-photo {
    z-index: 5;
    border-radius: 50%;
    object-fit: cover;
  }

  .img-box .bird-photo {
    z-index: 4;
    opacity: 0;
    object-fit: contain;
    transform: translate(-50%, -50%) scale(1);
    top: 50%;
    left: 50%;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 100%;
    pointer-events: none;
  }

  .active .profile-photo {
    opacity: 0;
  }

  .active .bird-photo {
    opacity: 1;
    z-index: 6;
    transform: translate(-50%, -50%) scale(1);
  }

  .img-box::before,
  .img-box::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: calc(100% + 10px);
    height: calc(100% + 10px);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: 0.4s;
    z-index: 1;
  }

  .img-box::before {
    background: conic-gradient(
      transparent 0deg,
      #ff00cc 60deg,
      #3333ff 120deg,
      transparent 180deg
    );
    animation: spin1 3s linear infinite;
  }

  .img-box::after {
    background: conic-gradient(
      transparent 180deg,
      #00ffcc 240deg,
      #ffcc00 300deg,
      transparent 360deg
    );
    animation: spin2 3s linear infinite;
  }

  .active .img-box::before,
  .active .img-box::after {
    opacity: 0;
  }

  .text-content {
    transition: 0.8s;
    transform-style: preserve-3d;
  }

  .active .text-content {
    transform: translateZ(40px);
  }

  h3 {
    color: #00ffff;
    margin-top: 10px;
    font-size: 24px;
  }

  p {
    color: #94a3b8;
    font-size: 15px;
    margin: 10px 0;
  }

  .bio {
    color: #64748b;
    font-size: 12px;
    line-height: 1.5;
    padding: 0 10px;
  }

  .icons {
    margin-top: 25px;
    transition: 0.8s;
    transform-style: preserve-3d;
  }

  .active .icons {
    transform: translateZ(30px) translateY(10px);
  }

  .icons a {
    text-decoration: none;
    width: 45px;
    height: 45px;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    border-radius: 50%;
    border: 2px solid #00ffff;
    color: #00ffff;
    margin: 0 5px;
    transition: 0.3s;
  }

  .icons a:hover {
    background: #00ffff;
    color: #0b132b;
    box-shadow: 0 0 15px #00ffff;
  }

  @keyframes rotateCard {
    from {
      transform: rotate(0deg);
    }
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes spin1 {
    from {
      transform: translate(-50%, -50%) rotate(0deg);
    }
    to {
      transform: translate(-50%, -50%) rotate(360deg);
    }
  }

  @keyframes spin2 {
    from {
      transform: translate(-50%, -50%) rotate(360deg);
    }
    to {
      transform: translate(-50%, -50%) rotate(0deg);
    }
  }
</style>
</head>

<body>

<div class="layout-container">

  <h2 class="outer-heading">About Developer</h2>

  <div class="card-container" onclick="this.classList.toggle('active')">

    <div class="card-wrapper">

      <div class="card">

        <div class="img-box">

          <!-- Profile Image Link -->
          <img
            src="https://i.ibb.co/svHHtGfg/1001087129.jpg"
            class="profile-photo"
            alt="profile photo"
          >

          <!-- Second Image Link -->
          <img
            src="https://i.ibb.co/4n0tt0w/bird.png"
            class="bird-photo"
            alt="bird photo"
          >

        </div>

        <div class="text-content">

          <h3>Sohel Rana</h3>

          <p>Android Apps Developer</p>

          <div class="bio">
            Hello, this is Sohel Rana, the developer of this app.
            I’m excited to inform you that the app will provide
            the contact numbers of all members working in
            Mirpur Crime Division of Dhaka.
          </div>

        </div>

        <div class="icons">

          <a href="tel:01781521122">
            <i class="fas fa-phone"></i>
          </a>

          <a href="mailto:rsohelrana214@gmail.com">
            <i class="fas fa-envelope"></i>
          </a>

          <a href="https://www.facebook.com/share/1AEupBceck/">
            <i class="fab fa-facebook-f"></i>
          </a>

        </div>

      </div>

    </div>

  </div>

</div>

</body>
</html>
